<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Event Ledger — UNZA Student Login, Alarm Scheduler &amp; File Library</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #0d1117;
      --surface: rgba(22, 27, 34, 0.94);
      --border: #30363d;
      --text: #f0f6fc;
      --muted: #a8b2bd;
      --green: #238636;
      --blue: #0969da;
      --teal: #0d9488;
      --orange: #f97316;
      --purple: #8250df;
      --red: #da3633;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      background-color: var(--page);
      background-image:
        linear-gradient(rgba(10, 15, 25, 0.55), rgba(10, 15, 25, 0.78)),
        url("unza.jpg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    button, a, input, select { font: inherit; }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid #58a6ff;
      outline-offset: 2px;
    }

    /* Login & Registration Screen */
    .auth-wrapper {
      min-height: 90vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    }

    .auth-card h2 {
      margin: 0 0 6px;
      text-align: center;
      font-size: 1.65rem;
    }

    .auth-card p.sub {
      margin: 0 0 18px;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #0d1117;
      color: var(--muted);
      font-weight: 650;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--green);
      border-color: var(--green);
      color: white;
    }

    .rule-hint {
      margin: -4px 0 12px 2px;
      color: #99f6e4;
      font-size: 0.78rem;
    }

    .error-msg {
      display: none;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid var(--red);
      border-radius: 7px;
      background: rgba(218, 54, 51, 0.22);
      color: #ffa198;
      font-size: 0.85rem;
    }

    /* Main Container */
    .container {
      display: none;
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(1.45rem, 3vw, 1.95rem);
    }

    header p, .intro {
      margin: 0;
      color: var(--muted);
    }

    .header-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .links, .category-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .site-link,
    .category-btn,
    .upload-btn,
    .file-action,
    .enable-btn,
    .logout-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 0;
      border-radius: 7px;
      color: white;
      text-decoration: none;
      font-weight: 650;
      cursor: pointer;
    }

    .site-link {
      padding: 9px 14px;
      background: var(--orange);
    }

    .site-link.sis {
      background: var(--purple);
    }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d1117;
      font-size: 0.88rem;
    }

    .logout-btn {
      padding: 6px 11px;
      background: var(--red);
      font-size: 0.82rem;
    }

    /* Alarm & Moodle Bars */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 13px 18px;
      border: 1px solid var(--teal);
      border-radius: 10px;
      background: rgba(13, 148, 136, 0.2);
    }

    .status-bar span {
      color: #99f6e4;
      font-size: 0.9rem;
    }

    .enable-btn {
      padding: 8px 14px;
      background: var(--teal);
      font-size: 0.85rem;
    }

    .moodle-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding: 14px 18px;
      border: 1px solid var(--orange);
      border-radius: 10px;
      background: rgba(249, 115, 22, 0.16);
    }

    .moodle-bar h3 {
      margin: 0 0 4px;
      color: #fdba74;
      font-size: 1rem;
    }

    .moodle-bar p {
      margin: 0;
      color: #e2e8f0;
      font-size: 0.84rem;
    }

    /* Section Headings */
    .section-title {
      margin: 24px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      font-size: 1.25rem;
    }

    /* Forms & Inputs */
    .field {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #0d1117;
      color: var(--text);
      font-size: 0.9rem;
    }

    .upload-btn {
      width: 100%;
      padding: 11px;
      background: var(--green);
    }

    .upload-btn:hover {
      background: #2ea043;
    }

    .upload-btn.teal {
      background: var(--teal);
    }

    /* Grids & Cards */
    .scheduler-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      scroll-margin-top: 16px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.12rem;
    }

    .card p.desc {
      min-height: 2.4em;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    /* Category Jump Bar */
    .intro {
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .category-nav {
      justify-content: center;
      margin: 14px 0 18px;
    }

    .category-btn {
      padding: 9px 13px;
      background: var(--blue);
    }

    .category-btn[data-category="Tests"] { background: #8250df; }
    .category-btn[data-category="Quizzes"] { background: #bf8700; }
    .category-btn[data-category="Labs"] { background: #cf222e; }
    .category-btn[data-category="Exams"] { background: #a40e26; }
    .category-btn[data-category="Other"] { background: var(--teal); }

    /* Lists & Items */
    .item-list {
      max-height: 310px;
      margin: 12px 0 0;
      padding: 0;
      overflow-y: auto;
      list-style: none;
    }

    .item-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: rgba(13, 17, 23, 0.88);
    }

    .item-main {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .item-title {
      font-weight: 650;
    }

    .item-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .badge {
      display: inline-block;
      margin-right: 5px;
      margin-bottom: 4px;
      padding: 2px 8px;
      border-radius: 12px;
      background: #1f6feb;
      color: white;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .badge.moodle { background: var(--orange); }
    .badge.other { background: var(--teal); }

    .item-actions {
      display: flex;
      flex: 0 0 auto;
      flex-direction: column;
      gap: 5px;
    }

    .file-action {
      padding: 6px 9px;
      font-size: 0.76rem;
    }

    .download-btn { background: #2563eb; }
    .delete-btn { background: var(--red); }

    .empty {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .notice {
      margin: 20px 0 0;
      padding: 12px 14px;
      border: 1px solid #9a6700;
      border-radius: 8px;
      background: rgba(154, 103, 0, 0.18);
      color: #f0d58c;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    /* Full-Screen Alarm Banner */
    .alarm-banner {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      padding: 18px 28px;
      border: 2px solid #fca5a5;
      border-radius: 12px;
      background: #cf222e;
      color: white;
      font-size: 1.08rem;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.75);
    }

    .stop-alarm-btn {
      margin-top: 10px;
      padding: 7px 18px;
      border: 0;
      border-radius: 6px;
      background: white;
      color: #cf222e;
      font-weight: bold;
      cursor: pointer;
    }

    #filePicker, #icsPicker { display: none; }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 720px) {
      .scheduler-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      body { padding: 12px; background-attachment: scroll; }
      header { padding: 15px; }
      .grid { grid-template-columns: 1fr; }
