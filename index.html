<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <title>MY UNILIFE(UNZA)</title>
  <meta name="description" content="MY UNILIFE(UNZA): schedule academic and personal events and keep encrypted files on your device.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --bg:#0d1117; --panel:rgba(22,27,34,.94); --line:#30363d; --text:#f0f6fc; --muted:#c9d1d9; --teal:#0d9488; --blue:#0969da; --red:#da3633; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; padding:20px; color:var(--text); font:16px/1.5 system-ui,"Segoe UI",sans-serif; background:linear-gradient(rgba(13,17,23,.82),rgba(13,17,23,.92)),url("unza-library.jpg") center/cover fixed no-repeat #0d1117; }
    main { max-width:1050px; margin:auto; }
    header,.panel,.status { padding:18px; border:1px solid var(--line); border-radius:12px; background:var(--panel); backdrop-filter:blur(8px); margin-bottom:16px; }
    header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; }
    h1,h2,h3,p { margin-top:0; } h1 { margin-bottom:4px; } p,.muted { color:var(--muted); }
    .links,.actions { display:flex; flex-wrap:wrap; gap:9px; }
    a,button,.button { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; border-radius:7px; padding:9px 13px; background:var(--blue); color:white; text-decoration:none; font:inherit; cursor:pointer; }
    button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:2px solid #79c0ff; outline-offset:2px; }
    .button-icon { line-height:1; }
    button.secondary { background:#30363d; } button.danger { background:var(--red); } button.teal { background:var(--teal); }
    .status { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; border-color:var(--teal); } .status p { margin:0; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .field { width:100%; margin:0 0 10px; padding:10px; border:1px solid var(--line); border-radius:7px; background:#0d1117; color:var(--text); font:inherit; }
    label { display:block; font-weight:600; margin:8px 0 4px; }
    .event-list,.file-list { list-style:none; padding:0; margin:0; }
    .row { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--line); } .row:first-child { border-top:0; } .row-main { min-width:0; flex:1; }
    .row-title { font-weight:700; overflow-wrap:anywhere; } .row small { display:block; color:var(--muted); }
    .row-actions { display:flex; gap:6px; flex-shrink:0; } .row-actions button { padding:6px 9px; font-size:.85rem; }
    .file-open { display:block; width:100%; padding:0; background:transparent; color:var(--text); text-align:left; text-decoration:none; border-radius:7px; }
    .file-open[aria-disabled="true"] { opacity:.65; cursor:not-allowed; }
    .file-open small { font-weight:400; }
    .file-actions-menu { position:relative; }
    .file-actions-menu summary { list-style:none; border-radius:7px; padding:6px 12px; background:#30363d; cursor:pointer; }
    .file-actions-menu summary::-webkit-details-marker { display:none; }
    .file-menu { position:absolute; z-index:8; top:calc(100% + 4px); right:0; display:grid; gap:4px; width:150px; padding:6px; border:1px solid var(--line); border-radius:8px; background:#161b22; box-shadow:0 8px 24px rgba(0,0,0,.35); }
    .file-menu button,.file-menu a { width:100%; padding:6px 8px; border:0; border-radius:6px; background:#30363d; color:var(--text); font:inherit; text-align:left; text-decoration:none; cursor:pointer; }
    .file-menu a[aria-disabled="true"] { opacity:.65; cursor:not-allowed; }
    .routine-alarm { top:130px; background:#0969da; border-color:#79c0ff; }
    #routineDateField[hidden],#routineWeekdayField[hidden] { display:none; }
    .notice { padding:12px; border:1px solid #9a6700; border-radius:8px; color:#f0d58c; background:rgba(51,40,13,.95); font-size:.92rem; }
    .alarm { display:none; position:fixed; z-index:5; top:15px; left:50%; transform:translateX(-50%); width:min(90vw,600px); padding:18px; border:2px solid #fca5a5; border-radius:12px; background:#3b1d24; box-shadow:0 12px 32px rgba(0,0,0,.45); }
    .alarm.show { display:block; } input[type=file] { padding:8px; } #icsPicker,#filePicker { display:none; }
    .empty { color:var(--muted); padding:8px 0; } .badge { display:inline-block; border-radius:12px; padding:2px 8px; margin-right:5px; background:#1f6feb; font-size:.78rem; } .badge.imported { background:#7c3aed; } .badge.missed { background:#da3633; } .missed-event { border-left:3px solid #da3633; padding-left:9px; }
    #app { display:none; }
    #loginScreen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .auth-card { width:min(420px,100%); padding:24px; border:1px solid var(--line); border-radius:12px; background:var(--panel); backdrop-filter:blur(8px); }
    .auth-card h1 { margin-bottom:6px; } .auth-card p { margin-bottom:16px; } .auth-card .field { margin-bottom:12px; }
    .field-hint { margin:-5px 0 12px!important; color:var(--muted); font-size:.82rem; }
    .password-field { display:flex; align-items:center; gap:8px; }
    .password-field .field { flex:1; min-width:0; width:auto; margin:0; }
    .password-toggle { flex-shrink:0; background:#30363d; }
    .auth-card .password-field { margin-bottom:12px; }
    .auth-tabs { display:flex; gap:8px; margin-bottom:18px; }
    .auth-tabs button { flex:1; background:#30363d; } .auth-tabs button.active { background:var(--blue); }
    .auth-message { min-height:24px; margin:10px 0 0; } .auth-card form button[type=submit] { min-width:130px; }
    .forgot-button { display:flex; margin-top:12px; padding:5px 0; background:transparent; color:#79c0ff; font-size:.9rem; }
    .reset-warning { margin:2px 0 12px!important; font-size:.84rem; }
    #installApp[hidden] { display:none; }
    header.dashboard-header { display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-start; gap:10px; }
    .dashboard-hero { width:100%; height:clamp(150px,24vw,230px); margin:0 0 2px; overflow:hidden; border:1px solid var(--line); border-radius:9px; background:#161b22; }
    .dashboard-hero img { display:block; width:100%; height:100%; object-fit:cover; object-position:center 43%; }
    #userSession { display:flex; align-items:center; flex-wrap:wrap; gap:7px; color:var(--muted); }
    #loggedInUser { font-size:.78rem; }
    #userSession button { background:#30363d; }
    #logout { padding:5px 9px; font-family:"Trebuchet MS",Verdana,sans-serif; font-size:.78rem; font-weight:700; letter-spacing:.03em; }
    .app-brand h1 { margin-bottom:2px; }
    .app-brand p { margin:0; }
    .app-nav { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:16px; }
    .app-nav button { background:#30363d; }
    .app-nav button[aria-selected="true"] { background:var(--blue); box-shadow:inset 0 -2px 0 #79c0ff; }
    .view-panel[hidden] { display:none; }
    #activityLogWrap { position:relative; }
    #activityLogButton { background:#30363d; }
    #activityLogPanel { position:absolute; z-index:10; top:calc(100% + 8px); right:0; width:min(340px,calc(100vw - 32px)); max-height:280px; overflow:auto; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#161b22; box-shadow:0 8px 24px rgba(0,0,0,.35); }
    #activityLogPanel[hidden] { display:none; }
    #activityLog { list-style:none; margin:0; padding:0; }
    #activityLog li { padding:7px 0; border-top:1px solid var(--line); }
    #activityLog li:first-child { border-top:0; }
    #activityLog small { display:block; color:var(--muted); }
    @media (max-width:700px) { body { padding:12px; } .grid { grid-template-columns:1fr; } .row { flex-direction:column; } .row-actions { flex-wrap:wrap; } }
    @media (max-width:480px) { .app-nav { grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px; padding:2px 0 8px; } .app-nav button { min-width:0; padding:8px 4px; gap:4px; font-size:.78rem; } }
  </style>
</head>
<body>
  <!-- App content remains unchanged -->
  <script src="app.js?v=13"></script>
</body>
</html>
